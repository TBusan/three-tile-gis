<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GeoEngine Demo — OSM Basemap + Multi-Layer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      font-family: system-ui, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
    }
    #app {
      position: relative;
      width: 100%; height: 100%;
    }
    canvas {
      display: block;
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
    }
    #panel {
      position: absolute;
      top: 12px; left: 12px;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid #444;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 13px;
      line-height: 1.6;
      pointer-events: none;
      user-select: none;
    }
    #panel span { color: #7ecfff; }
  </style>
  <script type="module" crossorigin src="/assets/index-Dsh_SYAR.js"></script>
</head>
<body>
  <div id="app">
    <div id="panel">
      <div>CRS: <span id="crs-name">—</span></div>
      <div>Center: <span id="crs-pos">—</span></div>
      <div>Zoom: <span id="crs-zoom">—</span></div>
      <div>Tiles: <span id="tile-count">0</span> loaded</div>
      <hr style="border-color:#444;margin:6px 0" />
      <div style="color:#888;font-size:11px">Phase 7:</div>
      <div style="color:#7ecfff;font-size:11px">TileScheduler 4D priority</div>
      <div style="color:#7ecfff;font-size:11px">Tile sharing + progressive display</div>
      <div style="color:#7ecfff;font-size:11px">Load cancel + fade-in (300ms)</div>
      <hr style="border-color:#444;margin:6px 0" />
      <div>Scheduler: <span id="scheduler-stats">—</span></div>
    </div>
  </div>
</body>
</html>
