<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GeoEngine — Mapbox 地形 + XYZ 瓦片叠加</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      font-family: system-ui, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
    }
    #app {
      position: relative;
      width: 100%; height: 100%;
    }
    canvas {
      display: block;
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
    }
    #panel {
      position: absolute;
      top: 12px; left: 12px;
      z-index: 1;
      background: rgba(0, 0, 0, 0.78);
      border: 1px solid #444;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 13px;
      line-height: 1.7;
      pointer-events: none;
      user-select: none;
      max-width: 340px;
    }
    #panel span { color: #7ecfff; }
    #panel .title {
      font-size: 14px;
      font-weight: bold;
      color: #ffd700;
      margin-bottom: 6px;
    }
    #panel .legend {
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px solid #444;
      font-size: 12px;
      color: #aaa;
    }
    #basemap-switcher {
      position: absolute;
      top: 12px; right: 12px;
      z-index: 2;
      display: flex;
      gap: 4px;
      padding: 4px;
      background: rgba(0, 0, 0, 0.78);
      border: 1px solid #444;
      border-radius: 8px;
      pointer-events: auto;
      user-select: none;
    }
    #basemap-switcher button {
      padding: 4px 10px;
      font-size: 12px;
      color: #e0e0e0;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 5px;
      cursor: pointer;
    }
    #basemap-switcher button:hover { background: rgba(255, 255, 255, 0.12); }
    #basemap-switcher button.active {
      background: #2a6df4;
      border-color: #5a9dff;
      color: #fff;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="panel">
      <div class="title">Mapbox 地形（terrain-rgb）+ XYZ 瓦片叠加</div>
      <div>FPS: <span id="fps-value" style="color:#7CFC00;font-weight:bold">—</span> <span id="frame-time" style="color:#888;font-size:11px"></span></div>
      <div>CRS: <span id="crs-name">—</span></div>
      <div>中心: <span id="crs-pos">—</span></div>
      <div>分辨率: <span id="crs-zoom">—</span></div>
      <div>瓦片: <span id="tile-count">0</span> 已加载</div>
      <div>调度: <span id="scheduler-stats">—</span></div>
      <div class="legend">
        <div>· 地形：Mapbox terrain-rgb 高程（-10000 ~ 10000m）</div>
        <div>· 叠加：XYZ 底图纹理精确贴合位移网格</div>
        <div>· 注意：需在 src/terrain.ts 顶部填 MAPBOX_TOKEN</div>
      </div>
    </div>
    <div id="basemap-switcher">
      <button data-kind="osm" class="active">OSM</button>
      <button data-kind="arcgis-img">影像</button>
      <button data-kind="mapbox">卫星</button>
    </div>
  </div>
  <script type="module" src="./src/terrain.ts"></script>
</body>
</html>
