<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GeoEngine — EPSG:3857 Web Mercator + XYZ 底图 + 矢量叠加</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      font-family: system-ui, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
    }
    #app {
      position: relative;
      width: 100%; height: 100%;
    }
    canvas {
      display: block;
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
    }
    #panel {
      position: absolute;
      top: 12px; left: 12px;
      z-index: 1;
      background: rgba(0, 0, 0, 0.78);
      border: 1px solid #444;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 13px;
      line-height: 1.7;
      pointer-events: none;
      user-select: none;
      max-width: 340px;
    }
    #panel span { color: #7ecfff; }
    #panel .title {
      font-size: 14px;
      font-weight: bold;
      color: #ffd700;
      margin-bottom: 6px;
    }
    #panel .legend {
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px solid #444;
      font-size: 12px;
    }
    #panel .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 3px 0;
    }
    #panel .legend-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      display: inline-block;
    }
    #panel .legend-line {
      width: 16px; height: 3px;
      display: inline-block;
    }
    #panel .legend-poly {
      width: 12px; height: 12px;
      border-radius: 2px;
      display: inline-block;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="panel">
      <div class="title">EPSG:3857 Web Mercator + XYZ 底图</div>
      <div>FPS: <span id="fps-value" style="color:#7CFC00;font-weight:bold">—</span> <span id="frame-time" style="color:#888;font-size:11px"></span></div>
      <div>CRS: <span id="crs-name">—</span></div>
      <div>中心: <span id="crs-pos">—</span></div>
      <div>分辨率: <span id="crs-zoom">—</span></div>
      <div>瓦片: <span id="tile-count">0</span> 已加载</div>
      <div>调度: <span id="scheduler-stats">—</span></div>
      <div class="legend">
        <div class="legend-item"><span class="legend-dot" style="background:#ff4444"></span> 兴趣点 (Point)</div>
        <div class="legend-item"><span class="legend-line" style="background:#00ff88"></span> 道路 (LineString)</div>
        <div class="legend-item"><span class="legend-poly" style="background:rgba(255,165,0,0.5)"></span> 建筑 (Polygon)</div>
      </div>
    </div>
  </div>
  <script type="module" src="./src/webmercator.ts"></script>
</body>
</html>
